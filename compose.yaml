name: jcl-portfolio

services:
  web:
    image: ${APP_IMAGE:?Run bash scripts/deploy.sh to select a release image}
    restart: unless-stopped
    init: true
    networks:
      ingress:
        aliases:
          - jcl-portfolio
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress:
    external: true
    name: ${INGRESS_NETWORK:-jcl-ingress}
