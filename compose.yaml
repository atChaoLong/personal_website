name: jcl-portfolio

services:
  web:
    image: jcl-portfolio:${IMAGE_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
