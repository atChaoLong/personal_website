# Unknown hosts are not routed to an application.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# Container-local liveness check. This port is not published.
server {
    listen 127.0.0.1:8080;
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
