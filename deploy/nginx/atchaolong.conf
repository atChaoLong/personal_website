# Install in /etc/nginx/conf.d/atchaolong.conf on the host.
# Keep proxy_pass in sync with APP_PORT in the website's .env.
server {
    listen 80;
    server_name atchaolong.me www.atchaolong.me;
    return 301 https://www.atchaolong.me$request_uri;
}

server {
    listen 443 ssl;
    server_name atchaolong.me;

    ssl_certificate /etc/nginx/certs/atchaolong.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/atchaolong.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.atchaolong.me$request_uri;
}

server {
    listen 443 ssl;
    server_name www.atchaolong.me;

    ssl_certificate /etc/nginx/certs/atchaolong.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/atchaolong.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Preserve Next.js streaming responses.
        proxy_buffering off;
    }
}
